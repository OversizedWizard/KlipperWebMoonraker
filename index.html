<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Klipper Screen</title>
  <link rel="stylesheet" href="css/style.css?v=3.8">
</head>

<body>
  <div id="root">
    <nav id="sidebar"></nav>
    <div id="main">
      <div id="topbar">
        <span id="conn" class="pill bad">● Offline</span>
        <button id="topback" class="btn sm" style="display:none">‹ Back</button>
        <div class="title" id="title">Home</div>
        <span id="probe-pill" title="Load cell probe force (tap to tare)">⚖ --.- g</span>
        <span id="clock">--:--</span>
        <button id="estop">⏻ E-STOP</button>
      </div>
      <div id="content">
        <div class="page active" id="p-home"></div>
        <div class="page" id="p-files"></div>
        <div class="page" id="p-printing"></div>
        <div class="page" id="p-history"></div>
        <div class="page" id="p-spool"></div>
        <div class="page" id="p-calibrate"></div>
        <div class="page" id="p-settings"></div>
        <div class="page" id="p-config"></div>
        <div class="page" id="p-logs"></div>
        <div class="page" id="p-power"></div>
        <div id="sub"></div>
        <div id="overlay"></div>
      </div>
    </div>
  </div>
  <div id="drag-fullscreen-overlay">
    <div class="dfo-box">
      <div style="width:64px;height:64px;margin:0 auto 12px;color:#00E5FF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" style="width:100%;height:100%">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </div>
      <h2>Drop Files to Upload</h2>
      <p>Target folder: <b id="dfo-dest" style="color:#00E5FF">/</b></p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/icons.js?v=3.6"></script>
  <script src="js/colicons.js?v=3.6"></script>
  <script src="js/moonraker.js?v=3.8"></script>
  <script src="js/animations.js?v=3.6"></script>
  <script src="js/app.js?v=3.9"></script>
  <script src="js/home.js?v=3.6"></script>
  <script src="js/gcode_viewer.js?v=3.6"></script>
  <script src="js/files.js?v=3.6"></script>
  <script src="js/history.js?v=3.7"></script>
  <script src="js/screens1.js?v=3.6"></script>
  <script src="js/screens3.js?v=4.1"></script>
  <script src="js/screens2.js?v=3.7"></script>
  <script src="js/config.js?v=4.0"></script>
  <script src="js/logs.js?v=3.6"></script>
</body>

</html>
